services:
  db:
    image: mysql:8.0
    container_name: pet_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: pet_adoption_db
      MYSQL_USER: pet_user
      MYSQL_PASSWORD: secure_password123
      MYSQL_ROOT_PASSWORD: root_password123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: ./backend
    container_name: pet_django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=pet_adoption_db
      - DB_USER=pet_user
      - DB_PASSWORD=secure_password123
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      - db

volumes:
  mysql_data: