<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Huellitas - Adopción de Mascotas{% endblock %}</title>
    <!-- Estilos CSS básicos -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
        header { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
        nav { background-color: #34495e; padding: 0.5rem; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { padding: 2rem; max-width: 1000px; margin: auto; }
        footer { background-color: #2c3e50; color: white; text-align: center; padding: 1rem; position: fixed; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>🐾 Huellitas</h1>
        <p>Plataforma de Adopción y Seguimiento de Mascotas</p>
    </header>
    <nav>
        <a href="{% url 'home' %}">Inicio / Catálogo</a>
        <a href="{% url 'login' %}">Iniciar Sesión</a>
        <a href="{% url 'registro' %}">Registrarse</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer>
        <p>&copy; 2026 Huellitas - Desarrollo de Aplicaciones 1</p>
    </footer>
</body>
</html>
