{% extends 'usuarios/base.html' %}

{% block title %}Registro - Huellitas{% endblock %}

{% block content %}
<h2>Registro de Usuario</h2>
<form method="post" style="background: white; padding: 20px; border-radius: 8px; max-width: 400px;">
    {% csrf_token %}
    <div style="margin-bottom: 15px;">
        <label>Nombre de Usuario:</label><br>
        <input type="text" name="username" style="width: 100%; padding: 8px;" required>
    </div>
    <div style="margin-bottom: 15px;">
        <label>Correo Electrónico:</label><br>
        <input type="email" name="email" style="width: 100%; padding: 8px;" required>
    </div>
    <div style="margin-bottom: 15px;">
        <label>Contraseña:</label><br>
        <input type="password" name="password" style="width: 100%; padding: 8px;" required>
    </div>
    <button type="submit" style="background: #2980b9; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">Registrarse</button>
</form>
{% endblock %}
